<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Audio Wave Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-orb {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .wave-bar {
      animation: bounce 1.4s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
    .node-orbit {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 120px; opacity: 0.15; }
      100% { r: 180px; opacity: 0.35; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes bounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Orbs in Background -->
  <circle class="pulse-orb" cx="150" cy="100" r="140" fill="#6366f1" opacity="0.2" filter="url(#glow)" />
  <circle class="pulse-orb" cx="1050" cy="300" r="160" fill="#ec4899" opacity="0.18" filter="url(#glow)" style="animation-delay: -2s;" />
  <circle class="pulse-orb" cx="950" cy="90" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)" style="animation-delay: -1s;" />

  <!-- Subtle Circuit / Audio Routing Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.35">
    <line x1="80" y1="60" x2="1120" y2="60" />
    <line x1="80" y1="360" x2="1120" y2="360" />
    <line x1="120" y1="40" x2="120" y2="380" />
    <line x1="1080" y1="40" x2="1080" y2="380" />
  </g>

  <!-- Dynamic Animated Equalizer / Audio Waveform Bars (Background/Decorative) -->
  <g transform="translate(600, 340) scale(1, -1)" fill="url(#waveGrad1)" opacity="0.45">
    <!-- Centered mirrored EQ bars -->
    <rect class="wave-bar" x="-320" y="0" width="8" height="60" rx="4" style="animation-delay: -0.2s;" />
    <rect class="wave-bar" x="-290" y="0" width="8" height="90" rx="4" style="animation-delay: -0.8s;" />
    <rect class="wave-bar" x="-260" y="0" width="8" height="45" rx="4" style="animation-delay: -0.4s;" />
    <rect class="wave-bar" x="-230" y="0" width="8" height="110" rx="4" style="animation-delay: -1.1s;" />
    <rect class="wave-bar" x="-200" y="0" width="8" height="75" rx="4" style="animation-delay: -0.6s;" />
    <rect class="wave-bar" x="-170" y="0" width="8" height="125" rx="4" style="animation-delay: -0.3s;" />
    <rect class="wave-bar" x="-140" y="0" width="8" height="50" rx="4" style="animation-delay: -0.9s;" />
    <rect class="wave-bar" x="-110" y="0" width="8" height="95" rx="4" style="animation-delay: -0.5s;" />
    <rect class="wave-bar" x="-80" y="0" width="8" height="140" rx="4" style="animation-delay: -1.2s;" />
    <rect class="wave-bar" x="-50" y="0" width="8" height="70" rx="4" style="animation-delay: -0.1s;" />
    <rect class="wave-bar" x="-20" y="0" width="8" height="130" rx="4" style="animation-delay: -0.7s;" />
    
    <rect class="wave-bar" x="20" y="0" width="8" height="130" rx="4" style="animation-delay: -0.7s;" />
    <rect class="wave-bar" x="50" y="0" width="8" height="70" rx="4" style="animation-delay: -0.1s;" />
    <rect class="wave-bar" x="80" y="0" width="8" height="140" rx="4" style="animation-delay: -1.2s;" />
    <rect class="wave-bar" x="110" y="0" width="8" height="95" rx="4" style="animation-delay: -0.5s;" />
    <rect class="wave-bar" x="140" y="0" width="8" height="50" rx="4" style="animation-delay: -0.9s;" />
    <rect class="wave-bar" x="170" y="0" width="8" height="125" rx="4" style="animation-delay: -0.3s;" />
    <rect class="wave-bar" x="200" y="0" width="8" height="75" rx="4" style="animation-delay: -0.6s;" />
    <rect class="wave-bar" x="230" y="0" width="8" height="110" rx="4" style="animation-delay: -1.1s;" />
    <rect class="wave-bar" x="260" y="0" width="8" height="45" rx="4" style="animation-delay: -0.4s;" />
    <rect class="wave-bar" x="290" y="0" width="8" height="90" rx="4" style="animation-delay: -0.8s;" />
    <rect class="wave-bar" x="320" y="0" width="8" height="60" rx="4" style="animation-delay: -0.2s;" />
  </g>

  <!-- Foreground Content: Header & Titles -->
  <g class="node-orbit">
    <!-- Icon / Audio Nodes Emblem -->
    <g transform="translate(600, 95)">
      <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" />
      <path d="M -12 -8 L -12 8 L 0 0 Z" fill="#38bdf8" />
      <path d="M 6 -12 C 12 -6 12 6 6 12" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M 12 -18 C 22 -9 22 9 12 18" stroke="#ec4899" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="175" text-anchor="middle" fill="url(#titleGrad)" filter="url(#glow)">
      Awesome Loopback Audio &amp; Routing
    </text>

    <!-- Subtitle / Tagline -->
    <text class="subtitle-text" x="600" y="215" text-anchor="middle">
      Virtual Audio Cables • PipeWire / JACK Graphs • Low-Latency Matrices • AoIP Bridges
    </text>

    <!-- Feature Pills -->
    <g transform="translate(600, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-315, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text class="badge-text" x="67" y="22" text-anchor="middle">🍎 macOS Drivers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-165, 0)">
        <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text class="badge-text" x="77" y="22" text-anchor="middle">🐧 PipeWire &amp; JACK</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
        <text class="badge-text" x="77" y="22" text-anchor="middle">🪟 Windows Cables</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
        <text class="badge-text" x="72" y="22" text-anchor="middle">🌐 Network AoIP</text>
      </g>
    </g>
  </g>
</svg>
